<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Hub - demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cloud:#FFF5E3;--paper:#FFFBF2;--stone:#D0C8BA;--ash:#2D2A27;--orange:#FF7023;--orange-d:#D55D1D;--mint:#C5E4CC;--moss:#8FA596;--basil:#5A6359;--rose:#F2CDC4;--quartz:#DEA193;--clay:#95685D;--cinn:#BD673D;--cinn-d:#9E5633;--walnut:#71584C;--line:#E4D9C6;--muted:#6B655D}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cloud);color:var(--ash);font:14px/1.45 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cinn-d)}
h1,h2,h3,h4,p{margin:0}
.ic{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--ash);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;background:var(--cloud);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo{height:30px;width:auto;display:block;flex:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tab{border:0;background:transparent;padding:7px 13px;border-radius:9px;color:var(--basil);cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{background:var(--rose)}
.tab.on{background:var(--ash);color:var(--cloud)}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--ash);background:transparent;cursor:pointer;text-decoration:none;color:var(--ash);font-weight:500;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--rose)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--ash)}
.btn.pri:hover{background:#FF8B4A}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--ash);color:var(--cloud)}
.btn.ghost{border-color:transparent;padding:4px 6px}
.btn.danger{border-color:var(--clay);color:var(--clay)}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--cinn-d);cursor:pointer;padding:4px;text-decoration:underline}
.me{display:flex;align-items:center;gap:6px;background:var(--rose);border-radius:999px;padding:3px 10px 3px 3px}
.me b{width:26px;height:26px;border-radius:50%;background:var(--quartz);display:grid;place-items:center;font-size:11px;font-weight:600}
.me i{font-style:normal;font-size:12px;text-transform:capitalize}
main{max-width:1280px;margin:0 auto;padding:16px 20px 48px}
.bar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--stone);border-radius:14px;padding:11px 15px;font-size:15px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search:focus-within{border-color:var(--ash)}
.barrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--quartz);background:var(--rose);font-size:12px;cursor:pointer}
.chip:hover{background:var(--quartz)}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;max-width:100%}
.fld input[type=date]{min-width:0;max-width:150px}
.fld select,.fld input{border:1px solid var(--stone);background:var(--paper);border-radius:8px;padding:5px 8px;color:var(--ash)}
.spacer{flex:1}
.fpanel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.fgroup h4{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--basil)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pillb{border:1px solid var(--stone);background:transparent;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.pillb:hover{border-color:var(--ash)}
.pillb.on{background:var(--ash);color:var(--cloud);border-color:var(--ash)}
.pillb small{opacity:.65;margin-left:3px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px;color:var(--muted);font-size:13px}
.focus{border:1px solid var(--quartz);border-radius:14px;overflow:hidden;background:var(--rose);margin-bottom:24px}
.shelf{border:1px solid var(--stone);border-radius:14px;overflow:hidden;background:#F3EADB;margin-bottom:24px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--basil);color:var(--cloud)}
.shh h3{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.shh .dotc{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1.5px var(--cloud)}
.shh .cnt{background:var(--orange);color:var(--ash);font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px}
.shh .link{color:var(--cloud);font-size:13px}
.focus .shh{background:var(--orange);color:var(--ash)}
.focus .shh .cnt{background:var(--ash);color:var(--cloud)}
.focus .shh .link{color:var(--ash)}
.shb{padding:12px}
.by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 3px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ash);white-space:nowrap}
.pchip b{width:18px;height:18px;border-radius:50%;background:rgba(45,42,39,.14);display:grid;place-items:center;font-size:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.doc{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.doc:hover{border-color:var(--stone)}
.doc h4{font-size:14px;font-weight:600;line-height:1.3;margin-top:4px;padding-right:2px;overflow-wrap:anywhere}
.doc h4 a{color:var(--ash);text-decoration:none}
.doc h4 a:hover{text-decoration:underline}
.bc{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--basil);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.ty{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--stone);align-self:flex-start}
.rp{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rp.od{background:var(--clay);color:var(--cloud)}
.rp.ds{background:var(--orange);color:var(--ash)}
.rp.sc{background:var(--mint)}
.rp.fl{background:var(--rose);border:1px solid var(--quartz)}
.doc .rp{position:absolute;top:11px;right:11px}
.rp[title]{cursor:help}
.dupchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--cinn);background:#fff;color:var(--cinn-d);border-radius:999px;font-size:11px;font-weight:600;padding:1px 9px;cursor:pointer;white-space:nowrap}
.dupchip:hover{background:var(--rose)}
.dupnote{font-size:12px;color:var(--cinn-d);margin-top:2px;line-height:1.35}
.toast.warn{background:var(--cinn-d)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:default}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:28px;font-weight:500;letter-spacing:-.02em}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--ash)}
button.kpi.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px;margin-bottom:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ph h3{font-size:14px;font-weight:600}
.ph select{border:1px solid var(--stone);background:var(--cloud);border-radius:8px;padding:3px 6px;font-size:12px;max-width:140px}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut svg{flex:none}
.donut path,.donut circle{cursor:pointer;transition:opacity .15s}
.legend{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px}
.lg{display:flex;align-items:center;gap:7px;border:0;background:transparent;text-align:left;cursor:pointer;padding:2px 4px;border-radius:6px;font-size:12px}
.lg:hover{background:var(--cloud)}
.lg.on{background:var(--rose)}
.lg.dim{opacity:.5}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.lg .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.hb{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:3px 2px;cursor:pointer;text-align:left;border-radius:6px;font-size:12px}
.hb:hover{background:var(--cloud)}
.hb .l{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;height:14px;background:var(--cloud);border-radius:4px;overflow:hidden}
.hb .f{display:block;height:100%;border-radius:4px}
.hb .n{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hb.dim{opacity:.45}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin:4px 0 10px}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px}
.stack button.dim{opacity:.4}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ash);font-size:15px;margin-bottom:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--rose);font-weight:600;white-space:nowrap}
th button{border:0;background:transparent;cursor:pointer;font-weight:600;padding:0}
tr:last-child td{border-bottom:0}
td.t{min-width:220px;font-weight:500}
td.t a{color:var(--ash)}
td.nw{white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 4px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pager div{display:flex;gap:6px;align-items:center}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.card p{color:var(--basil);font-size:13px}
.sec{margin:22px 0 8px;font-size:16px;font-weight:600}
.req{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .w{flex:1;min-width:200px}
.issue{padding:9px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue b{font-weight:600}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sev.w{background:var(--orange)}.sev.i{background:var(--moss)}.sev.r{background:var(--clay)}
.sel,.inp,.ta{border:1px solid var(--stone);background:var(--paper);border-radius:8px;padding:6px 9px;width:100%}
.ta{min-height:76px;resize:vertical}
.ov{position:fixed;inset:0;background:rgba(45,42,39,.5);z-index:50;display:grid;place-items:start center;padding:5vh 14px;overflow:auto}
.modal{background:var(--cloud);border-radius:16px;width:min(680px,100%);padding:18px 20px;border:1px solid var(--stone)}
.modal h2{font-size:18px;font-weight:600;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--basil);font-weight:500}
.form .full{grid-column:1/-1}
.form .req-s{color:var(--clay)}
.meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--clay);font-size:12px;margin-top:8px;min-height:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ash);color:var(--cloud);padding:9px 14px;border-radius:10px;font-size:13px;max-width:90vw}
.toast.err{background:var(--clay)}
.gate{max-width:520px;margin:9vh auto;padding:0 16px}
.gate .card{padding:22px}
.gate .brand{margin-bottom:14px}
.warnb{background:var(--rose);border:1px solid var(--quartz);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.act{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--stone)}
.act.CREATE,.act.RESTORE,.act.ACCESS_GRANTED{background:var(--mint)}
.act.DELETE,.act.BLOCKED,.act.ACCESS_DENIED{background:var(--clay);color:var(--cloud)}
.act.UPDATE,.act.VISIT{background:var(--rose)}
.act.SCHEMA_CHANGE,.act.ROLE_CHANGE,.act.DUPLICATE{background:var(--orange)}
@media (max-width:760px){.form{grid-template-columns:1fr}.top{padding:8px 12px}.tabs{order:3;flex:1 1 100%}.tr{margin-left:0}main{padding:12px}.charts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.shell.nosd{grid-template-columns:1fr}.shell.nosd .side{display:none}
.side{background:var(--paper);border-right:1px solid var(--line);padding:14px 10px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;z-index:40}
.side .brand{padding:4px 6px 16px;font-size:19px;line-height:1.15;gap:10px;white-space:normal;letter-spacing:-.02em}
.side .logo{height:40px;width:auto}
.gate .brand{font-size:22px}
.gate .logo{height:40px}
.nvg{font-size:12px;color:var(--muted);padding:14px 10px 4px;font-weight:500}
.nv{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:9px;color:var(--basil);cursor:pointer;text-align:left;font-weight:500;font-size:13px}
.nv:hover{background:var(--rose)}
.nv.on{background:var(--ash);color:var(--cloud)}
.nv .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nv.on .n{color:var(--stone)}
.nv .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
.maincol{min-width:0}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--stone);border-radius:12px;padding:7px 12px;flex:1;min-width:170px;max-width:560px}
.gsearch input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.gsearch:focus-within{border-color:var(--ash)}
.menub{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0;line-height:1.15}
.kick{font-size:12px;font-weight:600;color:var(--cinn-d)}
.bnd{border-radius:14px;padding:12px 16px;margin-bottom:10px}
.bnd .t{font-size:12px;opacity:.9;margin-bottom:8px;font-weight:500}
.bnd.ash{background:var(--ash);color:var(--cloud)}.bnd.wal{background:var(--walnut);color:var(--cloud)}.bnd.stn{background:var(--stone)}.bnd.lt{background:#E7E3DC}.bnd.cin{background:var(--cinn-d);color:var(--cloud)}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px}
.pp b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.pp span.r{display:block;font-size:12px;opacity:.85}
.odot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.lgd{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin:2px 0 4px;flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.wsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:6px}
.wsc{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.wsc:hover{border-color:var(--ash)}
.wsc b{font-size:14px;font-weight:600}
.pl2{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:500;align-self:flex-start}
.pl2.due{background:var(--orange)}.pl2.ok{background:var(--mint)}
.guide h3{font-size:16px;font-weight:600;margin:12px 0 4px}.guide h4{font-size:14px;font-weight:600;margin:10px 0 3px}
.guide p{margin:5px 0;color:var(--basil);font-size:13px;line-height:1.55}.guide ul{margin:5px 0;padding-left:20px;color:var(--basil);font-size:13px;line-height:1.55}
.guide>:first-child{margin-top:0}
.cap2{font-size:11px;color:var(--muted);margin-top:14px}
.hm{display:block;width:100%;border:0;border-radius:6px;padding:5px 0;cursor:pointer;font-size:12px;color:var(--ash);background:transparent;min-width:34px}
.hm.on{box-shadow:inset 0 0 0 2px var(--ash)}
table.mx th,table.mx td{text-align:center;padding:6px 6px}
table.mx th:first-child,table.mx td:first-child{text-align:left}
.rl{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:0;cursor:pointer;font-weight:500;color:var(--ash)}
.rl.e{background:var(--mint)}.rl.v{background:#E7E3DC}.rl.a{background:var(--orange)}.rl[disabled]{cursor:default;opacity:.85}
.ckg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}.ckg label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.panel.wide{grid-column:1/-1}
.tbd{font-style:italic;font-weight:500;opacity:.7}
.gintro{margin-bottom:10px}.gintro .gt{margin:0 0 6px}
.gt{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.gp{margin:6px 0;color:var(--basil);font-size:14px;line-height:1.55}
.gsec{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;align-items:start}
.gcard h3{margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--orange);font-size:15px;font-weight:600}
.gcard ul{margin:0;padding-left:18px;color:var(--ash);font-size:13px;line-height:1.55}
.gcard li{margin:0 0 5px}
.gcard .gp{font-size:13px}
.gnote{background:var(--rose);border-left:4px solid var(--orange);border-radius:4px 10px 10px 4px;padding:9px 12px;font-size:13px;margin-top:10px}
.glink{font-weight:600}
.tp{margin-bottom:12px}.tp h3{margin-bottom:8px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-104%);transition:transform .18s ease}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(45,42,39,.45)}.menub{display:inline-flex}.top{padding:8px 12px;flex-wrap:nowrap;gap:8px}.top .spacer{display:none}.gsearch{flex:1 1 0;min-width:0;max-width:none}.tr{flex:none;flex-wrap:nowrap;gap:6px}.tr .sync,.tr .bl,.me i{display:none}.tr .btn{padding:7px 9px}.me{padding:3px}}

.shared{border:1px solid var(--quartz);border-radius:14px;overflow:hidden;background:#FBEAE3;margin-bottom:24px}
.shared .shh{background:var(--rose);color:var(--ash)}.shared .shh h3{font-size:15px}.shared .cnt{background:var(--ash);color:var(--cloud)}.shared .shh .link{color:var(--cinn-d)}
.shnote{padding:0 14px 10px;font-size:12px;color:var(--basil)}
.assg{display:flex;align-items:center;gap:5px;color:var(--cinn-d)}
.wsc.shc{background:#FBEAE3;border-color:var(--quartz)}
.assignbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--stone);border-radius:10px;padding:9px 11px;background:var(--paper)}
.assignbox .albl{font-size:12px;color:var(--basil);font-weight:500}
.ckl{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.ckg label[disabled],.ckg input:disabled+*{opacity:.5}

.fpanel2{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:2px}
.dd{position:relative;min-width:0}
.ddb{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--stone);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px;line-height:1.2}
.ddb:hover{border-color:var(--ash)}
.dd.has .ddb{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.ddl{color:var(--basil);font-size:12px;font-weight:500;white-space:nowrap}
.ddv{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dd.has .ddv{color:var(--cinn-d)}
.ddb svg{flex:none;transition:transform .15s}.dd.open .ddb svg{transform:rotate(180deg)}
.ddp{position:absolute;z-index:25;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(340px,calc(100vw - 32px));background:#fff;border:1px solid var(--stone);border-radius:12px;box-shadow:0 8px 24px rgba(45,42,39,.16);padding:8px;display:flex;flex-direction:column;gap:6px}
.ddsearch{border:1px solid var(--stone);border-radius:8px;padding:6px 9px;background:var(--paper);width:100%}
.ddlist{max-height:248px;overflow-y:auto;display:flex;flex-direction:column}
.ddopt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.ddopt:hover{background:var(--rose)}
.ddopt input{accent-color:var(--orange);width:16px;height:16px;flex:none;margin:0}
.ddt{flex:1;min-width:0;overflow-wrap:anywhere}.ddopt small{color:var(--muted);font-variant-numeric:tabular-nums}
.ddf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 4px 0;font-size:12px;color:var(--muted)}
.ddnone{padding:10px;color:var(--muted);font-size:12px}
.fbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--orange);color:var(--ash);font-size:11px;font-weight:600;margin-left:2px}
.btn.on .fbadge{background:var(--orange)}

.shtable{padding:12px}.shtable .tw{background:#fff}

.lt{display:block}
.lkstat{font-size:12px;color:var(--basil);line-height:1.35}.lkstat:empty{display:none}
.lkstat.busy::before{content:'';display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid var(--stone);border-top-color:var(--orange);border-radius:50%;animation:lkspin .7s linear infinite;vertical-align:-1px}
.lkstat.ok::before{content:'\2713  ';color:var(--cinn-d);font-weight:700}
.lkstat.muted{color:var(--muted)}
.autofilled{background:#FFF1E6!important;border-color:var(--orange)!important}
@keyframes lkspin{to{transform:rotate(360deg)}}
</style>

(function(){

ab starts empty in this edition. Add your own rows if you want a Team panel on the pages\n *  (columns: Section, Workstream, Role, Org, Name, Note). */\nfunction seedTeam_(s) { return 0; }\n/* ---------- triggers: direct edits in the sheet ---------- */\nvar ADMIN_ONLY_TABS = ['Access', 'Access_Requests', 'Audit_Log', 'Archive', 'Config', 'Project_Spec'];\n\nfunction onSheetEdit(e) {\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(20000)) { try { bump_(); } catch (x) {} return; }\n  try {\n    var r = e.range, sheet = r.getSheet(), name = sheet.getName();\n    var email = String((e.user && e.user.getEmail()) || '').toLowerCase();\n    var u = email ? userOf_(email) : { email: '', role: 'unknown', edit: [] }, role = u.role;\n    var isWs = wsNames_().indexOf(name) >= 0;\n    function revert() { if (e.oldValue !== undefined) r.setValue(e.oldValue); else r.clearContent(); }\n    if (!isWs) {\n      if (name === TAB.CONFIG) cfgDirty_();\n      if (name === TAB.ACCESS) accessDirty_();\n      if (name === TAB.HOME || name === TAB.TEAM) {\n        contentDirty_();\n        if (email && RANK[role] \u003c RANK.admin) {\n          revert(); contentDirty_();\n          logEvent_({ user: email, role: role, action: 'BLOCKED', source: 'Sheet', title: name, details: 'Only owners and admins can edit this tab. Change reverted.' });\n        } else if (name === TAB.HOME) {\n          try { styleHome_(sheet, r.getRow(), Math.min(r.getLastRow(), r.getRow() + 40)); } catch (x) { console.error('style home', x); }\n        }\n        return;\n      }\n      if (ADMIN_ONLY_TABS.indexOf(name) >= 0 && role !== 'owner' && email) {\n        revert();\n        if (name === TAB.ACCESS) accessDirty_();\n        logEvent_({ user: email, role: role, action: 'BLOCKED', source: 'Sheet', title: name, details: 'Only owners can edit this tab. Change reverted.' });\n      }\n      return;\n    }\n    var hr = headerRow_(sheet), single = r.getNumRows() === 1 && r.getNumColumns() === 1;\n eet.getRange(rowStart, 1, nRows, lc).getValues();\n    var changedCols = {}, logs = [], touched = [], needIds = 0, nextId = null;\n    function put(row, i, val) { if (i >= 0) { block[row][i] = val; changedCols[i] = true; } }\n    for (var q0 = 0; q0 \u003c nRows; q0++) {\n      var v0 = block[q0], c0 = (iT >= 0 && v0[iT] !== '') || (iU >= 0 && v0[iU] !== '');\n      if (c0 && iId >= 0 && (v0[iId] === '' || v0[iId] === null)) needIds++;\n    }\n    if (needIds) nextId = allocIds_(needIds);\n    for (var k = 0; k \u003c nRows; k++) {\n      var vals = block[k];\n      var content = (iT >= 0 && vals[iT] !== '') || (iU >= 0 && vals[iU] !== '');\n      if (!content) continue;\n      var isNew = iId >= 0 && (vals[iId] === '' || vals[iId] === null);\n      if (isNew) {\n        var id = fmtId_(nextId++);\n        put(k, iId, id);\n        if (iA >= 0 && !vals[iA]) put(k, iA, today);\n        if (iM >= 0 && !vals[iM]) put(k, iM, today);\n        if (iS >= 0 && !vals[iS]) put(k, iS, 'Active');\n        put(k, iB, by);\n        if (iAB >= 0 && !vals[iAB]) put(k, iAB, by);\n        if (iTy >= 0 && iU >= 0) put(k, iTy, detectType_(vals[iU]));\n        logs.push({ user: email, role: role, action: 'CREATE', source: 'Sheet', ws: name, id: id, title: vals[iT >= 0 ? iT : 0], details: 'Row added directly in the sheet' });\n        touched.push(k); continue;\n      }\n      if (touchesOnlyStamps) continue;\n      if (iM >= 0 && !manualMod) put(k, iM, today);\n      put(k, iB, by);\n      if (iTy >= 0 && iU >= 0 && iU >= c1 && iU \u003c= c2) put(k, iTy, detectType_(vals[iU]));\n      var id2 = iId >= 0 ? vals[iId] : '';\n      if (single) logs.push({ user: email, role: role, action: 'UPDATE', source: 'Sheet', ws: name, id: id2, title: iT >= 0 ? vals[iT] : '', field: headers[c1], old: e.oldValue === undefined ? '' : e.oldValue, neu: e.value === undefined ? '' : e.value });\n      else logs.push({ user: email, role: role, action: 'UPDATE', source: 'Sheet', ws: name, id: id2, title: iT >= 0 ? vals[iT] : '', details: 'Multi-cell edit in ' + r.getA1Notation() });\n      touched.push(k);\n    }\n    Object.keys(changedCols).forEach(function (ci) {\n      ci = +ci;\n      sheet.getRange(rowStart, ci + 1, nRows, 1).setValues(block.map(function (row) { return [row[ci]]; }));\n    });\n    if (iL >= 0 && iW >= 0 && touched.length) {\n      var schedCheck = { roles: { latest: rl.latest, window: rl.window } };\n      [rl.next, headers.filter(function (x) { return /weekday/i.test(x); })[0]].filter(Boolean).forEach(function (nm) {\n        var ci = headers.indexOf(nm), key = nm === rl.next ? 'NEXT_VISIT_FORMULA' : 'WEEKDAY_FORMULA';\n        if (ci \u003c 0 || !String(cfg_()[key] || '').trim()) return;\n        var fs = sheet.getRange(rowStart, ci + 1, nRows, 1).getFormulas(), out = [], any = false;\n        for (var q = 0; q \u003c nRows; q++) {\n          var cur = block[q][ci], f = fs[q][0];\n          if (!f && (cur === '' || cur === null) && touched.indexOf(q) >= 0 && isSched_(schedCheck, block[q][iL], block[q][iW])) { out.push([formulaText_(key, headers, rl, rowStart + q)]); any = true; }\n          else out.push([f || cur]);\n        }\n        if (any) sheet.getRange(rowStart, ci + 1, nRows, 1).setValues(out);\n      });\n    }\n    // Track duplicate links (within this workstream) created by typing or pasting directly in the sheet.\n    if (iU >= 0 && iU >= c1 && iU \u003c= c2 && touched.length) {\n      var wh = readWs_(name, false), wsc = schema_(wh);\n      touched.forEach(function (k) {\n        var others = dupInWs_(wh, wsc, block[k][iU], block[k][iId]);\n        if (others.length) logs.push(dupLog_({ email: email, role: role }, String(block[k][iId] || ''), iT >= 0 ? block[k][iT] : '', headers[iU], block[k][iU], others, name));\n      });\n    }\n    logBatch_(logs);\n    if (iId >= 0 && touched.length) {\n      shadowUpsert_(touched.filter(function (k) { return block[k][iId]; }).map(function (k) {\n        var o = {}; headers.forEach(function (hname, i) { if (hname) o[hname] = fromCell_(block[k][i]); });\n        return { id: String(block[k][iId]), ws: name, json: JSON.stringify(o) };\n      }));\n    }\n  } catch (err) { console.error('onSheetEdit', err); }\n  finally { try { bump_(); } catch (x) {} lock.releaseLock(); }\n}\n\n/** Structural changes only. A document that exists in some workstream tab is never archived, so cutting a row from one tab and pasting it into another is safe. */\nfunction onSheetChange(e) {\n  var t = e && e.changeType; if (t === 'FORMAT') return;\n  var email = String((e && e.user && e.user.getEmail()) || '').toLowerCase();\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(25000)) return;\n  try {\n    if (t === 'INSERT_GRID' || t === 'REMOVE_GRID') { wsDirty_(); contentDirty_(); }\n    if (t === 'INSERT_COLUMN' || t === 'REMOVE_COLUMN')\n      logEvent_({ user: email, role: email ? roleOf_(email) : '', action: 'SCHEMA_CHANGE', source: 'Sheet', details: t + '. The web app picks up the new columns automatically.' });\n    if (['REMOVE_ROW', 'REMOVE_GRID', 'INSERT_GRID', 'OTHER'].indexOf(t) \u003c 0) return;\n    var cur = {};\n    wsNames_().forEach(function (n) {\n      var h = readWs_(n, false), idN = h.headers.indexOf(SYS.ID); if (idN \u003c 0) return;\n      h.vals.forEach(function (r) { if (r[idN]) cur[String(r[idN])] = n; });\n    });\n    var sh = ss_().getSheetByName(TAB.SHADOW);\n    if (sh && sh.getLastRow() > 1) {\n      var arch = sh_(TAB.ARCHIVE), archived = {};\n      if (arch.getLastRow() > 1) arch.getRange(2, 1, arch.getLastRow() - 1, 1).getValues().forEach(function (r) { archived[String(r[0])] = 1; });\n      sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues().forEach(function (s) {\n        var id = String(s[0]);\n        if (!id || cur[id] || archived[id]) return;\n        var o = {}; try { o = JSON.parse(s[1]); } catch (x) {}\n        var title = o.Title || o.Name || '', url = o.URL || o.Link || '', ws = String(s[3] || o.Workstream || '');\n        arch.appendRow([id, title, url, new Date(), email || 'unknown', 'Row removed directly in the sheet', s[1], ws]);\n        logEvent_({ user: email, role: email ? roleOf_(email) : '', action: 'DELETE', source: 'Sheet', ws: ws, id: id, title: title, details: 'Row removed in the sheet and moved to Archive' });\n      });\n    }\n    refreshShadow_();\n  } catch (err) { console.error('onSheetChange', err); }\n  finally { try { bump_(); } catch (x) {} lock.releaseLock(); }\n}\n","/**\n * Document Hub - Spec.gs\n * Source of truth for the Project_Spec tab. Each requirement change ships as a new Spec.gs\n * (bumped version + change-log row). Paste it in and run: Document Hub > Sync project spec.\n */\nvar SPEC_VERSION = '2.5.0';\nvar SPEC_DATE = '2026-10-18';\nvar SPEC_TITLE = 'Document Hub - project spec';\n\nvar SPEC_ROWS = [\n  ['Overview', 'O1', 'Purpose', 'One-stop virtual library of program documents (pre-reads, meeting documents, notes, playbooks and more), organized by workstream, with one sheet tab per topic or team.', 'Approved'],\n  ['Overview', 'O2', 'Source of truth', 'The source Google Sheet: one tab per workstream (CTO, MDM, Supply Chain Planning, Fulfillment and Execution, Procure to Pay, Order to Cash, Core Finance, Reverse Logistics and Service) with identical headers. Any tab with Title and URL headers is treated as a workstream, in tab order. The app reads columns by header name.', 'Approved (v2.0.0)'],\n  ['Overview', 'O3', 'Platform', 'Google Apps Script web app. Execute as owner; access limited to accounts on the domain set as DOMAIN in Code.gs.', 'Approved'],\n  ['Overview', 'O4', 'Origin', 'Built from Gabby-Sunlong Document Central v1.7.0 with its own sheet, Access list, Log and Archive. Nothing is shared between the two apps.', 'Approved'],\n  ['Workstreams', 'W1', 'Eight workstream pages', 'Each workstream has its own page in the left sidebar showing only its documents, with its own filters, shelves, Add, Edit, Visited, Move and Delete. Counts and an orange due marker show next to each name.', 'Approved (v2.0.0)'],\n  ['Workstreams', 'W2', 'Sync per workstream', 'Add, edit, mark visited and delete write to that workstream\\'s own tab, and edits made in a tab appear in the app. Doc IDs are unique across all tabs (one sequence). If the same Doc ID appears in two tabs, the later one is given a new ID and logged.', 'Approved (v2.0.0)'],\n  ['Workstreams', 'W3', 'One home workstream, plus Move', 'A document lives in one workstream. Move to workstream transfers it to another tab and keeps its Doc ID, Date Added and Added By. Moving needs edit rights in both workstreams. Cutting and pasting a row between tabs in the sheet is not treated as a deletion.', 'Approved (v2.0.0)'],\n  ['Workstreams', 'W4', 'Everyone sees every workstream', 'All signed-in people with access can read all eight workstreams and the program structure.', 'Approved (v2.0.0)'],\n  ['Workstreams', 'W5', 'Shared area: All Workstream Assignment', 'A ninth tab, All Workstream Assignment (Config SHARED_TAB), holds documents that apply to several workstreams so each is stored once. It has the workstream tab headers plus Assigned To: All (or blank) for every workstream, or workstream names separated by semicolons. Setup creates it when missing; typing off in Config turns it off. The label All Workstream used in categories is unrelated.', 'Approved (v2.3.0)'],\n  ['Workstreams', 'W6', 'Where shared documents appear', 'A document in the shared area shows in a strip, Shared with this workstream, at the top of every workstream page it is assigned to (it can be hidden), and on the shared page itself, which lists them all with an Assigned to filter. The strip follows the page search and filters. Shared documents are counted once: they are not added to any workstream count, and Insights shows the shared area as its own row so totals reconcile.', 'Approved (v2.3.0)'],\n  ['Workstreams', 'W7', 'Who may change shared documents', 'Owners, admins and editors who are granted the shared area (Editor of in the Access tab, or a * grant) can add, edit, visit, move and delete shared documents, wherever the card appears. Editors of an ordinary workstream, and viewers, read them. The shared area is a column of its own in the Governance access matrix.', 'Approved (v2.3.0)'],\n  ['Workstreams', 'W8', 'Moving and merging into the shared area', 'Move can send a document into the shared area (choosing its assignment) or back to a workstream (where it becomes that workstream\\'s own). Governance flags the same link kept in several workstreams and offers Merge into shared: one copy stays with its Doc ID, the chosen title and the chosen assignment, and the other copies go to the Archive. It also suggests moving documents marked with the Config SHARED_HINT value (default All Workstream) that sit in one workstream.', 'Approved (v2.3.0)'],\n  ['Home', 'H1', 'Home page', 'Home shows the program structure from the Team tab (Executive program leadership, Core leadership team, PMO team, Extended team, cross-functional teams), eight workstream cards (documents, due count, workstream lead), the guide written in the HOME tab, and the confidentiality footer.', 'Approved (v2.0.0)'],\n  ['Home', 'H2', 'Team tab', 'The Team tab (Section, Workstream, Role, Org, Name, Note) holds the program structure and each workstream team, empty at first (add your own rows). Owners and admins edit it; roles without a name are hidden from viewers; several names in one cell are separated by a semicolon. Org is an optional label. Open positions typed as TBH or TBD show muted in italics. A workstream page shows its own team.', 'Approved (v2.2.0)'],\n  ['Home', 'H3', 'HOME tab', 'The HOME tab is a designed page and also the on-screen guide. Column A holds the text (bold words and links typed in the cell carry through), column B a Style (Title, Heading, Text, Bullet, Note, Link, Spacer, Accent) picked from a list, column C an optional web link. In the app the Title and lead text form an intro card and every Heading starts a card. A row an owner or admin adds or restyles is formatted automatically; Document Hub > Restyle HOME page re-applies the design to all rows. A HOME tab in the older one-column format (# heading, - bullet) is still read.', 'Approved (v2.2.0)'],\n  ['Design', 'D1', 'Layout', 'Left sidebar navigation: Home, Insights, the eight workstreams, Governance, Log. The app title and logo sit at the top of the sidebar at 19 px with a 40 px logo. On narrow screens the sidebar becomes a menu.', 'Approved (v2.2.0)'],\n  ['Design', 'D2', 'Brand', 'A warm neutral palette with an orange accent (#FF7023) and a placeholder library icon; replace the logo and colours with your own. Neutrals dominate, orange is the accent for primary actions and key highlights; secondary colors carry chart categories; extended palette for functional states only.', 'Approved'],\n  ['Design', 'D3', 'Accessibility', 'Ash Gray text on orange buttons (white on orange is only ~3:1). Cinnamon 600 (#9E5633) for orange-toned text on cream. Status is never shown by color alone.', 'Approved'],\n  ['Design', 'D4', 'Insights interaction', 'Every Insights chart, tile and cell is clickable and cross-filters all the others and the records table. Selected items stay highlighted; Clear all resets.', 'Approved'],\n  ['Insights', 'I1', 'Workstream-aware Insights', 'Insights spans all workstreams: a scope selector, tiles (documents, due or overdue, changed in 7 days, duplicate links, contributors), documents by workstream, revisit health by workstream, a workstream-by-category heatmap, a donut and bar grouped by any column, weekly activity, documents added by person, and a records table that includes the Workstream column.', 'Approved (v2.0.0)'],\n  ['Audience', 'A1', 'Broad audience', 'Most people are viewers who use the app only; they get no direct access to the spreadsheet and do not see the Open source sheet button. Keep the sheet itself shared as Restricted.', 'Approved'],\n  ['Audience', 'A2', 'Optional open viewing', 'Config AUTO_VIEWER = on gives every signed-in account on your domain viewer access automatically (logged as ACCESS_GRANTED by auto). Leave it blank so approvals are manual. Editor, admin and owner always need approval.', 'Approved'],\n  ['Audience', 'A3', 'Load', 'The app checks for changes every 30 seconds (POLL_SECONDS) using a cached token, so many viewers add little load.', 'Approved'],\n  ['Features', 'F1', 'Filters and search', 'Filters are a compact row of dropdown buttons, one for every categorical column (including Workstream on Insights) plus Revisit status, Link check and, on the shared page, Assigned to. Each opens a checklist with several values tickable at once and a live count beside each value; long lists have a search box, and each list can be cleared on its own. The Filters button shows how many filters are active, and active filters also show as removable chips. Lists work from the keyboard (Enter opens, Space ticks, Escape closes) and open fully on screen on a phone. Also: date range on any date column, refresh, clear all, and a top search box that searches every workstream (or only the open one).', 'Approved (v2.4.0)'],\n  ['Features', 'F3', 'CRUD', 'Add, edit, mark visited, move and soft-delete from the dashboard, limited by the person\\'s workstream rights.', 'Approved'],\n  ['Features', 'F4', 'Source button', 'Header button opens the source sheet (editors, admins and owners only).', 'Approved'],\n  ['Features', 'F5', 'Near-real-time sync', 'App polls the sheet every POLL_SECONDS. Installable edit/change triggers log and stamp direct sheet edits in any workstream tab. True push is not possible in Apps Script.', 'Approved'],\n  ['Features', 'F6', 'Dynamic columns', 'Adding, renaming, reordering or deleting columns in a workstream tab is reflected in the app: table columns, edit form fields, filters and chart group-by options are built from the header rows.', 'Approved'],\n  ['Features', 'F7', 'Data quality', 'Governance flags duplicate links and duplicate titles within a workstream, links that may not open for others, missing categories, overdue revisits, missing Next Visit formulas and possible typos.', 'Approved (v2.2.0)'],\n  ['Features', 'F8', 'Shelf order', 'Shelves on a workstream page follow SHELF_ORDER (Config, blank by default), then size. \"Due for revisit\" always stays first.', 'Approved'],\n  ['Features', 'F9', 'Added by', 'Each card shows who added it as a colored name chip. Added By is stamped once at creation and never changes. Display names come from the Access tab (Name column).', 'Approved'],\n  ['Features', 'F10', 'Duplicate link tracking', 'A duplicate is the same link used twice inside ONE workstream. The same link in different workstreams is allowed and never flagged. Duplicates are marked \"Duplicate link x N\" on their cards; the form warns while typing a link already used in the chosen workstream; saving, moving into a workstream that already has the link, or pasting one in the sheet writes a DUPLICATE Log entry naming the other documents.', 'Approved (v2.2.0)'],\n  ['Features', 'F13', 'Fill a new document from its link', 'In the Add form the link comes first. Paste a Google Docs, Sheets, Slides, Forms or Drive link and the app reads it and fills the Title, the Note (from the Drive description) and categories, and says what it filled. It never overwrites anything the person typed, never blocks saving, and only looks up links for people who can add in the chosen workstream. Only Google links are read; other links are typed by hand.', 'Approved (v2.5.0)'],\n  ['Features', 'F14', 'Privacy of link lookup', 'Details are returned only when the file\\'s sharing list shows the person could open it themselves (named on the file, shared with their whole domain, shared with anyone, or owner). Otherwise nothing is filled and the message is the same whether the file is private, hidden or does not exist. Folder names are returned only for folders the person can open. Groups are not resolved. Drive details are cached for 5 minutes but the access decision is made per person every time; lookups are limited to 30 a minute per person.', 'Approved (v2.5.0)'],\n  ['Features', 'F15', 'Category fill and folder memory', 'Categories (Project, L_1, L_2, L_3) are filled in this order: what earlier documents from the same Drive folder were filed under (learned each time a document is added from a link and saved, kept in the hidden _Folders tab); a folder whose name equals a value already used in that column (a leading number such as 03. is ignored); the Project most documents in the workstream use. Drive folder names are never copied as new categories. Editing a document does not change what a folder has learned.', 'Approved (v2.5.0)'],\n  ['Features', 'F12', 'Cards or Table, per page', 'Cards and Table is chosen separately for each page: every workstream, the shared area and All documents keep their own choice, so switching one never changes another. The choice is remembered in the browser (and still works for the session if the browser blocks storage). The Shared with this workstream band follows the page: cards on Cards, a table (same columns, Assigned To included, same editing buttons, sortable) on Table.', 'Approved (v2.4.1)'],\n  ['Features', 'F11', 'Next Visit reliability', 'Next Visit and Weekday are formulas written from the Config templates for every new row. A row with a schedule but no formula shows a calculated date marked \"(calc.)\"; saving repairs it and admins can repair all rows at once.', 'Approved'],\n  ['Governance', 'G1', 'Roles', 'Viewer: read all workstreams, app only. Editor: viewer plus add, edit, visit, move and delete in the workstreams listed for them (Access tab column Editor of; * means all). Admin: everything in every workstream, plus approving access, managing viewers and editors, restoring the Archive, repairs and the Log. Owner: everything an admin can do, plus granting admin and owner and changing the sheet structure. The shared area counts as a workstream for editing rights.', 'Approved (v2.3.0)'],\n  ['Governance', 'G2', 'Access request', 'Domain users sign in with Google, request access (optionally naming the workstreams they want to edit), owners and admins are emailed, and approve or deny in-app, choosing the role and the workstreams. The requester is emailed the outcome.', 'Approved (v2.0.0)'],\n  ['Governance', 'G3', 'Initial owner', 'The email set as OWNER_SEED in Code.gs', 'Approved'],\n  ['Governance', 'G4', 'Sheet edit rights', 'In a workstream tab only people who may edit that workstream can change rows; others are reverted and logged as BLOCKED. Only owners and admins change headers, HOME and Team. Sheet sharing is aligned to the Access tab for editors, admins and owners.', 'Approved (v2.0.0)'],\n  ['Governance', 'G5', 'Soft delete', 'Deleting removes the row from its tab and stores a full snapshot, with its workstream, in the Archive tab (who, when, why). An admin or owner can restore it to the same workstream. Rows deleted directly in the sheet are archived by a trigger.', 'Approved (v2.0.0)'],\n  ['Governance', 'G6', 'Audit log', 'Audit_Log records create, update (field, old, new), delete, move, restore, visit, duplicate, repair, access and role events, blocked edits and schema changes, each with its workstream, from the app and from the sheet.', 'Approved (v2.0.0)'],\n  ['Governance', 'G7', 'Log view', 'The Log tab (owners and admins) opens on the latest 10 transactions. Next 1 day, Next 1 week and Next 1 month step back through history; a date range shows everything between two dates; the table can be filtered by action and workstream.', 'Approved (v2.0.0)'],\n  ['Governance', 'G8', 'Connection check', 'Owners and admins see a Connection card on Governance naming the sheet, app name, code version and number of workstream tabs.', 'Approved'],\n  ['Data model', 'M1', 'System columns', 'Doc ID, Doc Type, Date Added, Last Modified, Modified By, Status and Added By follow the user columns on every workstream tab. The app adds a virtual Workstream column from the tab name.', 'Approved (v2.0.0)'],\n  ['Data model', 'M2', 'Dates', 'Date Added and Last Modified are static values. Date Added is stamped once at creation. Last Modified auto-stamps on every edit unless set by hand.', 'Approved'],\n  ['Data model', 'M3', 'Doc Type', 'Auto-detected from the URL (Sheet, Slides, Doc, Folder, Form, App Script, Email, Asana, Wiki, Hub page, Video, PDF, Link).', 'Approved'],\n  ['Data model', 'M4', 'Header row', 'Auto-detected as the row containing the URL header (row 3 in the current tabs). Override with HEADER_ROW in Config.', 'Approved'],\n  ['Data model', 'M5', 'Tabs', 'HOME, one tab per workstream, Team, Access, Access_Requests, Audit_Log, Archive, Config, Project_Spec, _Shadow (hidden). Admin tabs are protected: owner only.', 'Approved (v2.0.0)'],\n  ['Performance', 'P1', 'Fast start', 'The first screen loads with the page (no extra server round trip). Rows travel as compact arrays. When the data must be rebuilt, each of the eight tabs is read with one call and formula columns are cached per tab.', 'Approved (v2.0.0)'],\n  ['Performance', 'P2', 'Light polling', 'The change check reads a cached token (no sheet call). A full reload runs only when something changed, plus a safety-net reload every 5 minutes. Polling backs off after errors and pauses in hidden tabs.', 'Approved'],\n  ['Performance', 'P3', 'Fast edits', 'Save, mark visited, move and delete write each row in one call and return just that row; the page patches it in place. If anyone else changed the sheet meanwhile, the page reloads fully.', 'Approved'],\n  ['Performance', 'P4', 'Caching', 'Access list and Config are cached for 5 minutes, workstream list for 10, HOME and Team for 5. Row versions use a fast in-code hash. The shadow copy updates one row at a time, finding its row with a text search instead of reading the whole ID column. A page load or change check that can be answered from the cache does not open the spreadsheet at all.', 'Approved (v2.1.0)'],\n  ['Performance', 'P5', 'Shared dataset cache', 'The built dataset is compressed and stored in the script cache, keyed by the change token, the day and the code version. After a change, one request rebuilds it (others wait briefly and then read the cache), and every later viewer is served from the cache with no sheet reads until the next change. Each person still gets only their own rights; the cache holds no access management data. A cache entry lives at most 3 minutes, so edits made by scripts that do not fire the sheet trigger still appear within 3 minutes, or at once with Refresh, which bypasses the cache. If the cache is unavailable the app reads the sheet as before.', 'Approved (v2.1.0)'],\n  ['Performance', 'P6', 'Instant feedback', 'Visited, Delete and Move change the page immediately and roll back with an error message if the server refuses or the connection fails. Save shows a Saving state. The duplicate-link check uses the cached dataset when it is current.', 'Approved (v2.1.0)'],\n  ['Performance', 'P7', 'Quiet refresh', 'When the page refreshes in the background, it redraws only if something on the current page changed, and it keeps your scroll position. A change in another workstream only updates the sidebar counts.', 'Approved (v2.1.0)'],\n  ['Performance', 'P8', 'Polling that follows activity', 'The change check runs at the POLL_SECONDS interval while the page is in use, slows down after 3 and 15 minutes without activity, pauses in a hidden tab, and checks at once when you come back.', 'Approved (v2.1.0)'],\n  ['Performance', 'P9', 'Load report', 'Owners and admins see on Governance how the last data load was served (from the shared cache or rebuilt from the sheet) and how long it took.', 'Approved (v2.1.0)'],\n  ['Spec', 'S1', 'Spec upkeep', 'This tab mirrors Spec.gs. Requirement changes ship as an updated Spec.gs; run Sync project spec to refresh this tab.', 'Approved']\n];\n\nvar SPEC_CHANGELOG = [\n  ['1.0.0', '2026-10-08', 'Created from Gabby-Sunlong Document Central v1.7.0: own source sheet, placeholder logo, generic titles, formula templates for Next Visit and Weekday, viewers use the app only, optional AUTO_VIEWER, clean-start tool for copied sheets, safety check against code bound to the wrong sheet.'],\n  ['1.0.3', '2026-10-09', 'Rename to Document Hub, automatic old-name mapping, owner-only Connection card.'],\n  ['2.0.0', '2026-10-12', 'Eight workstream tabs: left sidebar, Home with program structure and guide, a page per workstream with its team, per-workstream editing rights with an admin role, Move to workstream, workstream-aware Insights, access matrix in Governance, Workstream column in Log, Archive and Shadow, Team and HOME tabs.'],\n  ['2.1.0', '2026-10-13', 'Speed: shared dataset cache with a single rebuild, cached Config, no spreadsheet open for cached loads and change checks, fewer sheet reads on edit, delete and move, instant Visited, Delete and Move with rollback, quiet background refresh that keeps scroll position, idle-aware polling, and a load report on Governance.'],\n  ['2.2.0', '2026-10-14', 'Duplicate links now count only inside one workstream; larger app title; Team tab filled from the program structure chart with open positions shown muted; HOME redesigned as a styled page (Content, Style, Link) with a card layout in the app, automatic styling of new rows and a Restyle HOME page menu.'],\n  ['2.3.0', '2026-10-15', 'Shared documents: the All Workstream Assignment tab with an Assigned To column (all or chosen workstreams), a Shared with this workstream strip on each workstream page, editing rights for the shared area, Move into and out of it, a Merge into shared tool for copies, a suggestion for documents marked All Workstream, and the shared area in Insights and the access matrix.'],\n  ['2.4.0', '2026-10-16', 'Filters changed from rows of pills to dropdown lists with multiple selection, live counts, search for long lists, per-list Clear, an active-filter badge and full keyboard support.'],\n  ['2.4.1', '2026-10-17', 'Cards or Table now applies to one workstream at a time (and is remembered), and the Shared with band switches to a table when its page is in Table view.'],\n  ['2.5.0', '2026-10-18', 'Paste a Google link in the Add form and the app fills the title, note and categories it can read, only for files the person could open themselves. The link is now the first field, the required star stays on its label line, and a new document\\'s button says Add document.']\n];\n\nvar SPEC_PROMPTS = [\n  ['1', 'Copy the solution into a new project called Document Hub for a broader audience, using the new source sheet and a placeholder logo, following the original setup requirements.', 'Built the Document Hub package (v1.0.0).'],\n  ['2', 'Rename the two apps; check the Hub connection; fix the displayed names.', 'Renamed, added the Connection card and automatic name mapping (v1.0.x).'],\n  ['3', 'Build eight workstream tabs (CTO, MDM, ...) with CRUD synced to matching sheet tabs, a HOME tab, the program structure from the org chart, an updated Insights tab, and maintained Governance and Log tabs.', 'Proposed the design with four mockups and asked eight questions.'],\n  ['4', 'Left sidebar; per-workstream roles with owner and admin able to do all; everyone sees everything; one home workstream plus Move; leave the Team names blank; draft the README into HOME; start empty; Insights is workstream-aware.', 'Built version 2.0.0.'],\n  ['5', 'Optimize the Hub code for faster run time, lower latency and higher user satisfaction.', 'Measured first, then built version 2.1.0: shared cache, fewer reads, instant feedback, quieter refresh.'],\n  ['6', 'Apply the duplicate rule within each workstream only; make the title bigger; fill the Team tab from the program structure chart; redesign the HOME tab to an industry-standard display.', 'Built version 2.2.0 and filled the Team tab and HOME page in the sheet.'],\n  ['7', 'Stop adding the same card to every workstream: store documents that apply to everyone or to a few workstreams once, in an area called All Workstream Assignment, editable by admins, owners and granted editors.', 'Built version 2.3.0 with the shared area, assignments, merge tool and the tab in your sheet.'],\n  ['8', 'Make the filter options dropdown lists with multiple selections.', 'Built version 2.4.0 with multi-select dropdown filters.'],\n  ['9', 'Make Cards or Table apply to one workstream only, and make the Shared with band follow the Table view.', 'Built version 2.4.1: a view choice per page and a table version of the shared band.'],\n  ['10', 'Let users paste only the URL when adding a document and have the app fill out the title and details.', 'Built version 2.5.0: Google links are read from Drive, with a privacy check, folder memory and category suggestions.']\n];\n\nfunction syncSpec() {\n  var s = ss_().getSheetByName(TAB.SPEC) || ensureTab_(TAB.SPEC, ['Section', 'ID', 'Item', 'Detail', 'Status']);\n  var out = [];\n  out.push(['Document', '', SPEC_TITLE, 'Version ' + SPEC_VERSION + ', updated ' + SPEC_DATE + '. Generated from Spec.gs; do not edit here.', 'Sheet ID: ' + SS_ID]);\n  out.push(['', '', '', '', '']);\n  out.push(['Section', 'ID', 'Item', 'Detail', 'Status']);\n  SPEC_ROWS.forEach(function (r) { out.push(r); });\n  out.push(['', '', '', '', '']);\n  out.push(['Change log', 'Version', 'Date', 'Change', '']);\n  SPEC_CHANGELOG.forEach(function (r) { out.push(['', r[0], r[1], r[2], '']); });\n  out.push(['', '', '', '', '']);\n  out.push(['Prompt log', 'Turn', 'Your request (summary)', 'Response (summary)', '']);\n  SPEC_PROMPTS.forEach(function (r) { out.push(['', r[0], r[1], r[2], '']); });\n  s.clear();\n  s.getRange(1, 1, out.length, 5).setValues(out).setVerticalAlignment('top').setWrap(true);\n  [3, 3 + SPEC_ROWS.length + 2, 3 + SPEC_ROWS.length + 2 + SPEC_CHANGELOG.length + 2].forEach(function (r) {\n    s.getRange(r, 1, 1, 5).setFontWeight('bold').setBackground('#F2CDC4');\n  });\n  s.getRange(1, 1, 1, 5).setFontWeight('bold').setFontSize(12);\n  s.setColumnWidths(1, 1, 110); s.setColumnWidths(2, 1, 70); s.setColumnWidths(3, 1, 220); s.setColumnWidths(4, 1, 620); s.setColumnWidths(5, 1, 130);\n  s.setFrozenRows(0);\n  try { logEvent_({ user: Session.getEffectiveUser().getEmail(), role: 'owner', action: 'SPEC_SYNC', source: 'Sheet', details: 'Project_Spec v' + SPEC_VERSION }); } catch (e) {}\n  return SPEC_VERSION;\n}\n"];
  var KEY='dh-demo-state',UKEY='dh-demo-user';
  function sget(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  function sset(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
  function sdel(k){try{sessionStorage.removeItem(k)}catch(e){}}
  var email=sget(UKEY)||DemoRuntime.OWNER,saved=sget(KEY);
  var demo;
  try{demo=DemoRuntime.build(FakeGoogle,FILES,{email:email,saved:saved})}catch(e){sdel(KEY);demo=DemoRuntime.build(FakeGoogle,FILES,{email:email})}
  var WRITES=/^(save|delete|move|mark|merge|set|remove|restore|decide|request|repair|sync)/i;
  function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x))}
  function persist(){sset(KEY,demo.g.snapshot())}
  function make(ok,fail){
    return new Proxy({},{get:function(_,name){
      if(name==='withSuccessHandler')return function(f){return make(f,fail)};
      if(name==='withFailureHandler')return function(f){return make(ok,f)};
      return function(){
        var args=[].slice.call(arguments);
        setTimeout(function(){
          try{
            var fn=demo.server[name];
            if(typeof fn!=='function'||/_$/.test(name))throw new Error('Unknown function '+name);
            var res=clone(fn.apply(null,args.map(clone)));
            if(WRITES.test(name))persist();
            if(ok)ok(res);
          }catch(e){ if(fail)fail(new Error(e&&e.message||String(e))); else console.error(e); }
        },25+Math.random()*45);
      };
    }});
  }
  window.google={script:{run:make(null,null)}};
  window.__demo=demo;
  // ---- the demo panel ----
  function el(t,a,h){var e=document.createElement(t);for(var k in a||{})e.setAttribute(k,a[k]);if(h!==undefined)e.innerHTML=h;return e}
  function copy(text,btn){
    function done(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o},1200)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){prompt('Copy this link:',text)})}
    else{prompt('Copy this link:',text)}
  }
  function mount(){
    var bar=el('div',{id:'demo-bar'});
    var pan=el('div',{class:'pan'});
    pan.appendChild(el('h4',{},'Demo with sample data'));
    pan.appendChild(el('p',{},'Nothing here is saved to Google. Your changes stay while this tab is open.'));
    var lab=el('label',{for:'demo-user'},'View the hub as');var sel=el('select',{id:'demo-user'});
    demo.users.forEach(function(u){var o=el('option',{value:u[0]},u[1]);if(u[0]===email)o.selected=true;sel.appendChild(o)});
    sel.onchange=function(){email=sel.value;sset(UKEY,email);demo.g.setUser(email);window.__BOOT=null;
      if(window.__dhBoot){Promise.resolve(window.__dhBoot()).then(function(){var h=document.querySelector('#side [data-tab="home"]');if(h)h.click();bar.classList.remove('open');pill.setAttribute('aria-expanded','false')})}else{location.reload()}};
    pan.appendChild(lab);pan.appendChild(sel);
    var row=el('div',{class:'row'});var rs=el('button',{class:'b'},'Reset demo');rs.onclick=function(){sdel(KEY);sdel(UKEY);location.reload()};row.appendChild(rs);pan.appendChild(row);
    pan.appendChild(el('label',{},'Try pasting a link in Add document'));
    demo.links.forEach(function(l){var d=el('div',{class:'lk'});d.appendChild(el('span',{},l.label));var b=el('button',{class:'b'},'Copy link');b.onclick=function(){copy(l.url,b)};d.appendChild(b);pan.appendChild(d)});
    var pill=el('button',{class:'pill','aria-expanded':'false'},'<i></i>Demo');
    pill.onclick=function(){var o=bar.classList.toggle('open');pill.setAttribute('aria-expanded',o)};
    bar.appendChild(pan);bar.appendChild(pill);document.body.appendChild(bar);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>

/* ---------- helpers ---------- */
const val=(r,c)=>{const x=r.v[c];return x===''||x==null?'(blank)':String(x)};
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const dayDiff=(a,b)=>Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))-Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/864e5);
const fmtD=s=>{if(!isISO(s))return s||'';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?u:'#';
const PEOPLE_COLORS=['#C5E4CC','#F2CDC4','#DEA193','#8FA596','#FFCFB6','#D0C8BA'];
function dn(e){e=String(e||'');if(!e)return '';const n=S.people[e.toLowerCase()];if(n)return n;if(e.indexOf('@')<0)return e;const p=e.split('@')[0].split(/[._-]/)[0];return p.charAt(0).toUpperCase()+p.slice(1)}
function pcol(e){const keys=Object.keys(S.people).sort();let i=keys.indexOf(String(e).toLowerCase());if(i<0){i=0;String(e).split('').forEach(c=>{i=(i*31+c.charCodeAt(0))>>>0})}return PEOPLE_COLORS[i%PEOPLE_COLORS.length]}
function pchip(e){if(!e)return '';return `<span class="pchip" style="background:${pcol(e)}" title="${esc(e)}"><b>${esc((dn(e)||'?').charAt(0).toUpperCase())}</b>${esc(dn(e))}</span>`}
const lab=(c,k)=>(c===S.R.addedBy||c===S.R.by)?dn(k):k;
function normUrl(u){
  u=String(u||'').trim();if(!u)return '';
  const m=/^(https?:)\/\/([^\/?#]+)([^?#]*)(\?[^#]*)?(#.*)?$/i.exec(u);if(!m)return u.toLowerCase();
  const host=m[2].toLowerCase(),path=m[3].replace(/\/+$/,''),q=(m[4]||'').replace(/^\?/,'');let frag=(m[5]||'').replace(/^#/,'');const params=[];
  q.split('&').forEach(p=>{if(!p)return;const k=p.split('=')[0].toLowerCase();if(/^(usp|ouid|rtpof|sd|authuser|hl|resourcekey|utm_[a-z]+)$/.test(k))return;params.push(p)});
  const g=/^gid=(\d+)$/.exec(frag);if(g){if(!params.some(p=>/^gid=/.test(p)))params.push('gid='+g[1]);frag=''}
  params.sort();return host+path+(params.length?'?'+params.join('&'):'')+(frag?'#'+frag:'');
}
function computeDups(){
  const R=S.R,m=new Map();S.dupCount=0;
  S.rows.forEach(r=>{r.dupKey='';r.dupN=0;const u=R.url?normUrl(r.v[R.url]):'';if(u){const k=r.ws+'||'+u;(m.get(k)||m.set(k,[]).get(k)).push(r)}});
  m.forEach(list=>{if(list.length>1){S.dupCount+=list.length;list.forEach(r=>{r.dupKey=r.ws+'||'+normUrl(r.v[S.R.url]);r.dupN=list.length})}});
  S.dupGroups=m;computeCross();
}
/* The same link kept in several workstreams (candidates to merge), and links already held in the shared area. */
const dupOthers=r=>(S.dupGroups.get(r.dupKey)||[]).filter(x=>x.id!==r.id);
const dupTip=r=>'Same link as '+dupOthers(r).map(o=>o.v[S.R.title]+' ('+o.id+', '+o.ws+')').join(', ')+'. Click to see them together.';
const initials=e=>String(e||'?').split('@')[0].split(/[._-]/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),(kind==='err'||kind==='warn')?7000:2800)}
const fail=e=>toast((e&&e.message)||String(e),'err');
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d)}
/* Next Visit as shown in the app: the sheet's value, or Latest Visit + Revisit Window when the sheet's cell is empty. */
function calcNext(o){
  const R=S.R,v=o.v;let nx=R.next?v[R.next]:'';o.nxCalc=false;
  if(isISO(nx))return nx;
  if(R.latest&&R.window){const l=v[R.latest],w=Number(v[R.window]);if(isISO(l)&&w>0){o.nxCalc=true;return addDays(l,w)}}
  return '';
}
function revStatus(r){
  const R=S.R,soon=+S.cfg.SOON_DAYS||2,nx=r.nx;
  if(isISO(nx)){const d=dayDiff(S.today,nx);return d<0?'Overdue':d<=soon?'Due soon':'Scheduled'}
  return R.revisit&&String(r.v[R.revisit]||'').trim()!==''?'Flagged, no date':'Not tracked';
}
function revWhy(r){
  const R=S.R,v=r.v,nx=r.nx,calc=r.nxCalc?' This date is calculated from Latest Visit and Revisit Window because the sheet has no Next Visit formula for this row.':'';
  if(r.rev==='Flagged, no date'){
    const noL=!R.latest||String(v[R.latest]||'')==='',noW=!R.window||String(v[R.window]||'')==='';
    const base='Marked for revisit, but there is no Next Visit date. ';
    if(noL&&noW)return base+'Latest Visit and Revisit Window (days) are both empty. Choose Visited to set today as the last visit, and add a window in Edit.';
    if(noL)return base+'Latest Visit is empty. Choose Visited to set it to today.';
    if(noW)return base+'Revisit Window (days) is empty. Add a number of days in Edit or in the sheet.';
    return base+'Revisit Window must be more than 0 days.';
  }
  if(!isISO(nx))return '';
  const d=dayDiff(S.today,nx);
  if(r.rev==='Overdue')return 'Next visit was '+fmtD(nx)+' ('+Math.abs(d)+(Math.abs(d)===1?' day':' days')+' ago). Open the document, then choose Visited.'+calc;
  if(r.rev==='Due soon')return 'Next visit is '+fmtD(nx)+(d===0?' (today).':' (in '+d+' day'+(d===1?'':'s')+').')+calc;
  if(r.rev==='Scheduled')return 'Next visit is '+fmtD(nx)+' (in '+d+' days).'+calc;
  return '';
}
function revPill(r){
  const nx=r.nx,w=revWhy(r),tip=w?` title="${esc(w)}" aria-label="${esc(w)}" tabindex="0"`:'';
  if(r.rev==='Overdue')return `<span class="rp od"${tip}>Overdue ${Math.abs(dayDiff(S.today,nx))}d</span>`;
  if(r.rev==='Due soon')return `<span class="rp ds"${tip}>Due ${esc(fmtD(nx))}</span>`;
  if(r.rev==='Scheduled')return `<span class="rp sc"${tip}>Scheduled</span>`;
  if(r.rev==='Flagged, no date')return `<span class="rp fl"${tip}>Flagged</span>`;
  return '';
}

/* ---------- filtering ---------- */
function pass(r,skip){
  const sk=skip?(Array.isArray(skip)?skip:[skip]):[];
  if(S.tab==='ws'&&r.ws!==S.ws&&sk.indexOf('__ws')<0)return false;
  if(S.assignF&&S.assignF.size&&isSharedRow(r)&&![...S.assignF].some(w=>appliesTo(r,w)))return false;
  if(S.q&&r.text.indexOf(S.q)<0)return false;

/* ---------- refresh without disturbing the page ---------- */

    S.timer=setTimeout(tick,delay);

}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function quality(){
  const R=S.R,out=[];

  if(R.url){
    S.dupGroups.forEach((list,k)=>{if(list.length>1)out.push({sev:'w',title:`Same link used by ${list.length} documents in ${list[0].ws}`,detail:'Merge them, or re-point one if they are meant to be different.',rows:list,key:k})});

    if(priv.length)add('w','Links tied to one person\'s account','These open only for the person who copied them (for example an inbox link). Share a stable link instead.',priv);

  }

  Object.keys(t).filter(k=>t[k].length>1).forEach(k=>add('w','Same title used more than once in '+t[k][0].ws,'Rename one so people can tell them apart.',t[k]));
  [R.project,R.l1].filter(Boolean).forEach(c=>{const b=S.rows.filter(r=>!r.v[c]);if(b.length)add('w',`${b.length} missing ${c}`,'These land in Unsorted on the shelves.',b)});
  const calcRows=S.rows.filter(r=>r.nxCalc);

  const keys=Object.keys(words),seen={};

  return out;
}

async function loadLog(){

    const r=await api('getLog',{mode:'latest',n:10});
    if(!r||!r.rows)throw new Error('The server sent back no log data. Make sure Code.gs is the latest version and the web app is deployed as a new version.');
    S.log=r;
  }catch(e){S.logErr=(e&&e.message)||String(e)}
  if(S.tab==='log')renderBody();
}
async function logMore(days){
  const L=S.log;if(!L||!L.cursor)return;
  const r=await api('getLog',{mode:'window',cursorRow:L.cursor.row,cursorTs:L.cursor.ts,days});
  if(!r||!r.rows)throw new Error('No log data came back. Try again.');
  S.log={mode:'window',rows:L.rows.concat(r.rows),cursor:r.cursor,older:r.older,total:r.total};
  if(!r.rows.length)toast('No transactions in that period. Try a longer one.');
  renderBody();
}
async function logRange(){
  const f=($('#lfrom')||{}).value,t=($('#lto')||{}).value;
  if(!f){toast('Choose a start date.','err');return}
  S.logFrom=f;S.logTo=t||f;
  const r=await api('getLog',{mode:'range',from:S.logFrom,to:S.logTo});
  if(!r||!r.rows)throw new Error('No log data came back. Try again.');
  S.log=r;renderBody();
}
function logRows(){

  return ((S.log&&S.log.rows)||[]).filter(r=>(!S.logAct||r.action===S.logAct)&&(!S.logWs||r.ws===S.logWs)&&(!q||Object.keys(r).map(k=>r[k]).join(' ').toLowerCase().indexOf(q)>=0));

}

function computeStats(){
  const st={};S.workstreams.forEach(w=>{st[w]={n:0,due:0}});
  S.rows.forEach(r=>{const s=st[r.ws]||(st[r.ws]={n:0,due:0});s.n++;if(r.rev==='Overdue'||r.rev==='Due soon')s.due++});
  S.wsStat=st;
}

function snapshot(){
  const m=new Map();S.rows.forEach(r=>m.set(r.id,r.ver+'|'+r.ws));
  return {m,cols:S.cols.map(c=>c.name).join('|'),edit:S.editSig,team:JSON.stringify(S.team),home:JSON.stringify(S.home),today:S.today,dup:S.dupCount||0,ws:S.workstreams.join('|')};
}
/* True when the data just loaded changes what the current page shows. */

function viewChanged(p){
  if(p.cols!==S.cols.map(c=>c.name).join('|')||p.edit!==S.editSig||p.team!==JSON.stringify(S.team)||p.home!==JSON.stringify(S.home)||p.today!==S.today||p.dup!==(S.dupCount||0)||p.ws!==S.workstreams.join('|'))return true;
  const touched=new Set(),now=new Set();
  S.rows.forEach(r=>{now.add(r.id);const o=p.m.get(r.id);if(o!==r.ver+'|'+r.ws){touched.add(r.ws);if(o)touched.add(o.split('|').pop())}});
  p.m.forEach((v,id)=>{if(!now.has(id))touched.add(v.split('|').pop())});
  if(!touched.size)return false;
  return S.tab==='ws'?(touched.has(S.ws)||(!!S.shared&&touched.has(S.shared))):true;
}

function optVisit(rec){
  const R=S.R,prev={v:Object.assign({},rec.v),nx:rec.nx,nxCalc:rec.nxCalc,rev:rec.rev};
  if(R.latest)rec.v[R.latest]=S.today;
  const w=R.window?Number(rec.v[R.window]):0;if(R.next&&w>0)rec.v[R.next]=addDays(S.today,w);
  rec.nx=calcNext(rec);rec.rev=revStatus(rec);computeStats();S.dv++;return prev;
}

function undoVisit(rec,prev){rec.v=prev.v;rec.nx=prev.nx;rec.nxCalc=prev.nxCalc;rec.rev=prev.rev;computeStats();S.dv++}

function restoreRow(row,idx){if(!row||S.rows.some(x=>x.id===row.id))return;S.rows.splice(Math.min(idx,S.rows.length),0,row);computeDups();computeStats();S.cm={};S.dv++}

function guideHTML(lines){
