/* Redraws the filter bar and the results, keeping the open list where it was scrolled. */

function renderFilters(focusVal){
  const list=document.querySelector('.dd.open .ddlist'),st=list?list.scrollTop:0,y=window.scrollY;
  $('#bar').innerHTML=barHTML();$('#head').innerHTML=headHTML();renderBody();
  const l2=document.querySelector('.dd.open .ddlist');if(l2)l2.scrollTop=st;window.scrollTo(0,y);
  if(focusVal!==undefined){const el=[...document.querySelectorAll('.dd.open .ddopt input')].find(x=>x.dataset.val===focusVal);if(el)el.focus({preventScroll:true})}
}

function closeDd(){if(S.openDd){S.openDd='';S.ddq='';const b=$('#bar');if(b)b.innerHTML=barHTML()}}

/* Add form: paste a Google link and the app fills in the title and details it can read. */
let LKID=0;

const normFolder=n=>String(n||'').replace(/^\s*\d+\s*[\.\)\-_:]\s*/,'').trim().toLowerCase();

function fieldEl(name){const i=S.formFields?S.formFields.findIndex(c=>c.name===name):-1;return i<0?null:document.querySelector('#modal [data-i="'+i+'"]')}
/* Fills a field only if it is empty or still holds what the app filled earlier: never what the person typed. */

function lkSet(name,val){
  const el=fieldEl(name);if(!el||!val)return false;
  const cur=String(el.value||'').trim();
  if(cur!==''&&cur!==S.lk.auto[name])return false;
  el.value=val;el.classList.add('autofilled');S.lk.auto[name]=val;return true;
}

function lkStatus(msg,cls){const el=$('#lkstat');if(!el)return;el.className='lkstat '+(cls||'');el.textContent=msg||''}
/* Categories: 1) what earlier documents from the same Drive folder were filed under, 2) a folder whose name equals a value already used
   in that column (a leading number such as "03." is ignored), 3) the Project most documents in this workstream use. */

function lkCats(res,ws){
  const R=S.R,out={},cols=[['project',R.project],['l1',R.l1],['l2',R.l2],['l3',R.l3]].filter(x=>x[1]);
  const L=res.learned;
  if(L)cols.forEach(([k,c])=>{if(L[k])out[c]=L[k]});
  const names=res.chain||[],used=new Set();
  cols.forEach(([k,c])=>{
    if(out[c])return;
    const known=new Map();S.rows.forEach(r=>{const x=String(r.v[c]||'').trim();if(x)known.set(x.toLowerCase(),x)});
    for(const n of names){if(used.has(n))continue;const hit=known.get(normFolder(n))||known.get(String(n).trim().toLowerCase());if(hit){out[c]=hit;used.add(n);break}}
  });
  if(R.project&&!out[R.project]){
    const cnt={};let tot=0;S.rows.forEach(r=>{if(r.ws!==ws)return;const x=String(r.v[R.project]||'').trim();if(x){cnt[x]=(cnt[x]||0)+1;tot++}});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]/tot>=0.6)out[R.project]=top[0];
  }
  return out;
}

async function lookupFor(url){
  if(S.formId||!S.R.url||!S.lk)return;
  url=String(url||'').trim();
  if(!/^https:\/\//i.test(url)||url===S.lk.url)return;
  const lk=S.lk;lk.url=url;lk.seq++;lk.folder=null;const seq=lk.seq;
  lkStatus('Looking up this link…','busy');
  let res;try{res=await api('lookupLink',url,formWs())}catch(e){res={ok:false,message:'Couldn\'t look this link up. Type the title yourself.'}}
  if(S.lk!==lk||lk.seq!==seq||!$('#lkstat'))return;
  if(!res||!res.ok){lkStatus((res&&res.message)||'Couldn\'t look this link up. Type the title yourself.','muted');return}
  const filled=[];
  if(lkSet(S.R.title,res.title))filled.push('Title');
  if(S.R.note&&res.note&&lkSet(S.R.note,res.note))filled.push('Note');
  const cats=lkCats(res,formWs());
  Object.keys(cats).forEach(c=>{if(lkSet(c,cats[c]))filled.push(c)});
  lk.folder=res.folder&&res.folder.id?{id:res.folder.id,name:res.folder.name||''}:null;
  lkStatus(filled.length?'Filled in from '+res.kind+': '+filled.join(', ')+'. Check them before saving.':'Read this '+res.kind+', but those fields were already filled in.','ok');
  updateDupNote();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  if(!e.target.closest('#side')&&!e.target.closest('[data-act=menu]'))closeSide();
  if(S.openDd&&!e.target.closest('.dd'))closeDd();
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  try{
  switch(a){
    case 'ovclick':if(e.target===t)closeModal();break;
    case 'mclose':closeModal();break;
    case 'go':go(d.tab,d.ws);break;
    case 'menu':$('#side').classList.toggle('open');break;
    case 'refresh':refreshNow();break;
    case 'filters':S.showF=!S.showF;if(!S.showF){S.openDd='';S.ddq=''}render();break;
    case 'ddopen':{S.openDd=S.openDd===d.key?'':d.key;S.ddq='';$('#bar').innerHTML=barHTML();
      const f=S.openDd?($('#ddq')||document.querySelector('.dd.open .ddopt input')):document.querySelector('.ddb[data-key="'+d.key+'"]');if(f)f.focus({preventScroll:true});const pp=document.querySelector('.ddp');if(pp)pp.scrollIntoView({block:'nearest'});break}
    case 'ddclear':ddClear(d.key);break;
    case 'clear':clearAll();break;
    case 'rmf':if(d.col==='__rev')S.rev=new Set();else if(d.col==='__dup')S.dup='';else if(d.col==='__assign')S.assignF=new Set();else delete S.f[d.col];S.page=1;render();break;
    case 'tog':toggle(d.col,d.val);break;
    case 'view':setView(d.v);render();break;
    case 'shelf':S.open[d.k]=!S.open[d.k];renderBody();break;
    case 'repairnext':{t.disabled=true;const r=await api('repairNextVisits');toast(r.fixed?'Repaired '+r.fixed+' formula'+(r.fixed>1?'s':''):'Nothing needed repair');await load(true);break}
    case 'dupall':S.dup=S.dup==='all'?'':'all';S.page=1;render();break;
    case 'dupgo':S.q='';S.qRaw='';S.f={};S.rev=new Set();S.dateCol='';S.from='';S.to='';S.dup=d.key;S.page=1;S.tab='all';S.ws='';setView('cards');S.shelfOv='Workstream';render();window.scrollTo(0,0);break;
    case 'seedue':{const on=S.rev.size===2&&S.rev.has('Overdue')&&S.rev.has('Due soon');S.rev=on?new Set():new Set(['Overdue','Due soon']);S.page=1;render();break}
    case 'hmcell':{const on=S.f.Workstream&&S.f.Workstream.size===1&&S.f.Workstream.has(d.ws)&&S.f[d.col]&&S.f[d.col].size===1&&S.f[d.col].has(d.val);
      if(on){delete S.f.Workstream;delete S.f[d.col]}else{S.f.Workstream=new Set([d.ws]);S.f[d.col]=new Set([d.val])}S.page=1;render();break}
    case 'sort':if(S.sort.col===d.col)S.sort.dir*=-1;else S.sort={col:d.col,dir:1};renderBody();break;
    case 'page':S.page=Math.max(1,S.page+(+d.d));renderBody();break;
    case 'export':exportCSV();break;
    case 'new':openForm('');break;
    case 'edit':openForm(d.id);break;
    case 'save':saveForm();break;
    case 'del':openDelete(d.id);break;
    case 'move':closeModal();openMove(d.id,d.to);break;
    case 'sharedtog':S.sharedOpen=!(S.sharedOpen!==false);renderBody();break;
    case 'assigntog':{if(!S.assignF)S.assignF=new Set();S.assignF.has(d.ws)?S.assignF.delete(d.ws):S.assignF.add(d.ws);S.page=1;render();break}
    case 'mergeopen':openMerge(d.key);break;
    case 'mergego':{const g=S.mergeGroup;if(!g)break;let assigned;try{assigned=readAssign('g')}catch(x){$('#gerr2').textContent=x.message;break}
      const pick=+((document.querySelector('input[name=mtitle]:checked')||{}).value||0),first=g.rows[pick],items=[first].concat(g.rows.filter((r,i)=>i!==pick)).map(r=>({id:r.id,ws:r.ws}));
      t.disabled=true;t.textContent='Merging…';try{const r=await api('mergeToShared',items,first.v[S.R.title],assigned);closeModal();if(r.ok){toast('Merged '+r.merged+' copies into '+S.shared);await load(true);if(S.tab==='governance')await loadGov()}else{toast(r.message||'Couldn\'t merge','err');await load(true)}}catch(x){t.disabled=false;t.textContent='Merge into shared';$('#gerr2').textContent=x.message||String(x)}break}
    case 'delgo':{t.disabled=true;const id=S.delId,ws=S.delWs,reason=($('#dreason')||{}).value||'';
      const idx=S.rows.findIndex(x=>x.id===id),gone=idx>=0?S.rows[idx]:null;closeModal();
      if(gone){removeLocal(id);render();toast('Moved to Archive')}
      try{const r=await api('deleteDoc',id,reason,S.token,ws);
        if(r.ok){if(!gone)toast('Moved to Archive');await afterWrite(r)}
        else{restoreRow(gone,idx);render();toast(r.message||'Couldn\'t delete','err');await load(true)}
      }catch(x){restoreRow(gone,idx);render();load(true).catch(()=>{});throw x}
      break}
    case 'movego':{let assigned='';if(S.shared&&($('#mvws')||{}).value===S.shared){try{assigned=readAssign('m')}catch(x){toast(x.message,'err');break}}
      t.disabled=true;const to=($('#mvws')||{}).value,id=S.moveId,from=S.moveFrom,rec=S.rows.find(x=>x.id===id);closeModal();
      const undo=()=>{if(rec){rec.ws=from;rec.v.Workstream=from;if(to===S.shared)rec.v[ASSIGN]='';computeStats();S.dv++;render()}};
      if(rec){rec.ws=to;rec.v.Workstream=to;if(to===S.shared)rec.v[ASSIGN]=assigned||'All';computeStats();S.dv++;render();toast('Moved to '+to)}
      try{const r=await api('moveDoc',id,from,to,S.token,assigned);
        if(r.ok){if(!rec)toast('Moved to '+to);if(r.dups&&r.dups.length)toast('Heads up: '+to+' already uses this link ('+r.dups.map(o=>o.title+', '+o.id).join('; ')+')','warn');await afterWrite(r)}
        else{undo();toast(r.message||'Couldn\'t move','err');await load(true)}
      }catch(x){undo();load(true).catch(()=>{});throw x}
      break}
    case 'visit':{const rec=S.rows.find(x=>x.id===d.id);if(!rec)break;
      const prev=optVisit(rec);render();toast('Marked as visited');
      try{const r=await api('markVisited',d.id,S.token,rec.ws);
        if(r.ok){S.visits.push({id:d.id,date:S.today});await afterWrite(r)}
        else{undoVisit(rec,prev);render();toast(r.message||'Couldn\'t update','err');await load(true)}
      }catch(x){undoVisit(rec,prev);render();load(true).catch(()=>{});throw x}
      break}
    case 'request':{const r=($('#reason')||{}).value||'',ws=[...document.querySelectorAll('.gws:checked')].map(x=>x.value);t.disabled=true;try{await api('requestAccess',r,ws);S.init=await api('getInit');renderGate();toast('Request sent to the owners and admins')}catch(x){$('#gerr').textContent=x.message;t.disabled=false}break}
    case 'approve':{const role=$('#rr-'+d.id).value,edit=[...document.querySelectorAll('.rqws[data-rq="'+d.id+'"]:checked')].map(x=>x.value);await api('decideRequest',d.id,'approve',role,edit);toast('Access granted');await loadGov();break}
    case 'deny':await api('decideRequest',d.id,'deny','',[]);toast('Request denied');await loadGov();break;
    case 'rmuser':if(confirm('Remove access for '+d.email+'?')){await api('removeUser',d.email);toast('Access removed');await loadGov()}break;
    case 'adduser':{const em=$('#nuemail').value.trim(),ro=$('#nurole').value,edit=[...document.querySelectorAll('.npws:checked')].map(x=>x.value);await api('setUserAccess',em,ro,edit);toast('Person added');await loadGov();break}
    case 'mx':{const u=S.gov.users.find(x=>x.email===d.email);if(!u)break;const set=new Set(u.edit.indexOf('*')>=0?S.allWs:u.edit);set.has(d.ws)?set.delete(d.ws):set.add(d.ws);const list=[...set];await api('setUserAccess',d.email,list.length?'editor':'viewer',list);toast('Access updated');await loadGov();break}
    case 'syncperm':await api('syncSheetPermissions');toast('Sheet sharing aligned');await loadGov();break;
    case 'logmore':t.disabled=true;await logMore(+d.days);break;
    case 'lrange':await logRange();break;
    case 'loglatest':S.logFrom='';S.logTo='';await loadLog();break;
    case 'logretry':await loadLog();break;
    case 'restore':await api('restoreDoc',d.id);toast('Document restored');await load(true);await loadGov();break;
  }
  }catch(x){fail(x);if(t&&t.disabled)t.disabled=false}
});
document.addEventListener('change',async e=>{
  const t=e.target,id=t.id;
  if(id==='dcol'){S.dateCol=t.value;if(!t.value){S.from='';S.to=''}S.page=1;render()}
  else if(id==='dfrom'){S.from=t.value;if(!S.dateCol){const f=S.cols.find(c=>c.type==='date'&&!c.hidden);S.dateCol=f?f.name:''}S.page=1;render()}
  else if(id==='dto'){S.to=t.value;if(!S.dateCol){const f=S.cols.find(c=>c.type==='date'&&!c.hidden);S.dateCol=f?f.name:''}S.page=1;render()}
  else if(id==='gA'){S.gA=t.value;delete S.f[S.gA];renderBody()}
  else if(id==='gB'){S.gB=t.value;renderBody()}
  else if(id==='hm'){S.hm=t.value;renderBody()}
  else if(id==='shelf'){if(S.tab==='all')S.shelfOv=t.value;else S.shelf=t.value;renderBody()}
  else if(id==='lm'){S.lm=t.value;renderBody()}
  else if(t.dataset&&t.dataset.act==='ddtog'){ddToggle(t.dataset.key,t.dataset.val)}
  else if(t.type==='url'&&t.closest&&t.closest('#modal')&&!S.formId){lookupFor(t.value)}
  else if(id==='fws'){const bx=$('#fassign');if(bx)bx.style.display=t.value===S.shared?'':'none';updateDupNote()}
  else if(id==='mvws'){const bx=$('#massign');if(bx)bx.style.display=t.value===S.shared?'':'none'}
  else if(t.dataset&&t.dataset.asall){toggleAssign(t.dataset.asall)}
  else if(id==='insScope'){delete S.f.Workstream;if(t.value)S.f.Workstream=new Set([t.value]);S.page=1;render()}
  else if(id==='lfrom'){S.logFrom=t.value}
  else if(id==='lto'){S.logTo=t.value}
  else if(id==='lact'){S.logAct=t.value;$('#logtbl').innerHTML=logTable()}
  else if(id==='lws'){S.logWs=t.value;$('#logtbl').innerHTML=logTable()}
  else if(t.dataset&&t.dataset.act==='setname'){try{await api('setUserName',t.dataset.email,t.value);toast('Name saved');await loadGov();await load(true)}catch(x){fail(x);await loadGov()}}
  else if(t.dataset&&t.dataset.act==='setrole'){try{const u=S.gov.users.find(x=>x.email===t.dataset.email)||{edit:[]};await api('setUserAccess',t.dataset.email,t.value,t.value==='editor'?(u.edit.length?u.edit:['*']):[]);toast('Access updated');await loadGov()}catch(x){fail(x);await loadGov()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='gq'){
    S.qRaw=e.target.value;clearTimeout(S._qt);
    S._qt=setTimeout(()=>{
      const raw=S.qRaw;
      if(S.tab!=='ws'&&S.tab!=='all'){
        if(!raw.trim())return;
        S.tab='all';S.ws='';S.f={};S.rev=new Set();S.dup='';S.dateCol='';S.from='';S.to='';S.shelfOv='Workstream';S.q=raw.toLowerCase().trim();S.page=1;render();
        const el=$('#gq');if(el){el.focus();el.setSelectionRange(raw.length,raw.length)}
      }else{S.q=raw.toLowerCase().trim();S.page=1;if(S.tab==='all')$('#head').innerHTML=headHTML();renderBody()}
    },150);
  }
  else if(e.target.classList&&e.target.classList.contains('autofilled')){e.target.classList.remove('autofilled');if(e.target.type==='url')updateDupNote()}
  else if(e.target.id==='ddq'){S.ddq=e.target.value;const l=document.querySelector('.dd.open .ddlist');if(l)l.innerHTML=ddListHTML(S.openDd)}
  else if(e.target.id==='lq'){S.logQ=e.target.value;$('#logtbl').innerHTML=logTable()}
  else if(e.target.dataset&&e.target.dataset.i!==undefined&&S.formFields&&S.formFields[+e.target.dataset.i]&&S.formFields[+e.target.dataset.i].name===S.R.url)updateDupNote();
});
document.addEventListener('paste',e=>{const t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='url'&&t.closest&&t.closest('#modal')&&!S.formId)setTimeout(()=>lookupFor(t.value),0)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.openDd){const k=S.openDd;closeDd();const b=document.querySelector('.ddb[data-key="'+k+'"]');if(b)b.focus();return}closeModal();closeSide()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.init&&S.init.role!=='none')checkNow()});
let lastAct=Date.now();
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>window.addEventListener(ev,()=>{const idle=Date.now()-lastAct;lastAct=Date.now();if(idle>180000&&S.init&&S.init.role!=='none'){checkNow();startPoll()}},{passive:true,capture:true}));
boot();

})();
